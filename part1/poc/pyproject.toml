[project]
name = "ducklake-feasibility-poc"
version = "0.1.0"
description = "Comparative micro-PoC for raw CSV, plain Parquet, and DuckLake-managed Parquet"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
